name: Daily Birthday Agent

on:
  schedule:
    # Runs at 07:00 UTC every day (which is 8:00 AM in Nigeria/Lagos time)
    - cron: '0 7 * * *'
  workflow_dispatch: # This allows you to manually trigger it from the GitHub website to test it

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Job
      env:
        # Pulls your secure keys from GitHub's secret vault
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        PRO_CHAT_ID: ${{ secrets.PRO_CHAT_ID }}
      run: python daily_job.py